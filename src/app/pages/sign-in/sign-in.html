<div class="h-dvh w-full bg-primary px-4 py-2 md:px-20 md:py-16">
  <h2 class="text-3xl font-semibold italic tracking-widest mt-4 sm:mt-0">
    BALA
    <span class="text-blue-600">.</span>
  </h2>

  <main class="h-full w-full flex items-center justify-center">
    <form
      class="bg-white flex flex-col gap-8 px-8 py-6 md:px-[72px] md:py-[48px] rounded-3xl max-w-xl w-full -mt-[72px]">
      <h1 class="text-[#101828] text-center text-3xl font-semibold">Login to your account</h1>

      <app-input text="Email" placeholder="Enter your email" type="email"></app-input>
      <app-input text="Password" placeholder="Enter your password" type="password" [forgot]="true"></app-input>

      <div class="flex flex-col gap-6">
        <app-button text="Login now"></app-button>
        <span class="font-light text-gray-400 text-center">Don't have an account ? <a
            class="text-blue-500 text-base font-normal cursor-pointer hover:underline">Sign
            up</a></span>
      </div>
    </form>
  </main>
</div>
